name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Check build environment
        run: |
          echo "=== Python ==="
          python --version
          python -m pip --version

          echo "=== Java ==="
          java -version

          echo "=== Buildozer ==="
          buildozer --version

          echo "=== Autoconf ==="
          autoconf --version | head -n 1

          echo "=== Automake ==="
          automake --version | head -n 1

          echo "=== Libtool ==="
          libtool --version | head -n 1

      - name: Check project
        run: |
          echo "=== Project files ==="
          ls -la

          echo "=== Buildozer spec ==="
          test -f buildozer.spec
          echo "buildozer.spec found"

          echo "=== Main Python file ==="
          test -f main.py
          echo "main.py found"

      - name: Prepare Buildozer
        run: |
          buildozer android p4a -- --help

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Show generated APK
        if: always()
        run: |
          echo "=== bin directory ==="
          ls -lah bin || true

          echo "=== APK files ==="
          find bin -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-android-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14