name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Prevent python-for-android from trying to open an interactive prompt.
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            gettext \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses-dev \
            libncursesw6 \
            libssl-dev \
            libtool \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "Cython==0.29.37" \
            "setuptools<70"

      - name: Print toolchain and project configuration
        run: |
          set -euxo pipefail

          echo "=== Python ==="
          python --version
          python -m pip --version

          echo "=== Buildozer ==="
          buildozer --version
          python -m pip show python-for-android || true

          echo "=== Java ==="
          java -version
          javac -version

          echo "=== Android configuration from buildozer.spec ==="
          grep -E \
            '^(android.api|android.minapi|android.ndk|android.archs|p4a.bootstrap|p4a.branch|requirements)' \
            buildozer.spec

          echo "=== Host configuration ==="
          uname -a
          lsb_release -a || true

      - name: Clean Buildozer output and caches
        run: |
          rm -rf .buildozer bin
          rm -rf ~/.buildozer

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Print Android SDK and NDK versions
        if: always()
        run: |
          set +e

          echo "ANDROIDSDKVER=${ANDROIDSDKVER:-unset}"
          echo "ANDROIDNDKVER=${ANDROIDNDKVER:-unset}"

          find "$HOME/.buildozer" -maxdepth 6 \
            \( -name sdkmanager -o -name avdmanager -o -name ndk-build \) \
            -type f -print 2>/dev/null || true

          find "$HOME/.buildozer" -maxdepth 6 -type f \
            -path '*/source.properties' \
            -exec sh -c 'echo "=== $1 ==="; cat "$1"' sh {} \; \
            2>/dev/null || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
