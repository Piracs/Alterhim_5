name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Python 3.14
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # ------------------------------------------------------------
      # Java 17
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # ------------------------------------------------------------
      # Source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # Linux build dependencies
      # ------------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            unzip \
            zip

      # ------------------------------------------------------------
      # Buildozer
      # ------------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      # ------------------------------------------------------------
      # Check versions
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"
          python --version
          python -m pip --version

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"
          buildozer --version

      # ------------------------------------------------------------
      # Configure buildozer.spec for current p4a develop
      # ------------------------------------------------------------
      - name: Configure Android build
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          replacements = {
              "android.api = 33": "android.api = 36",
              "android.minapi = 24": "android.minapi = 24",
              "android.ndk = 25b": "android.ndk = 29",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          if "p4a.branch" in text:
              lines = []
              for line in text.splitlines():
                  if line.strip().startswith("p4a.branch"):
                      lines.append("p4a.branch = develop")
                  else:
                      lines.append(line)
              text = "\n".join(lines) + "\n"
          else:
              text += "\np4a.branch = develop\n"

          text = text.replace(
              "# android.accept_sdk_license = False",
              "android.accept_sdk_license = True"
          )

          path.write_text(text)
          PY

          echo "======================================"
          echo "FINAL BUILD CONFIGURATION"
          echo "======================================"

          grep -E \
            "^(android.api|android.minapi|android.ndk|p4a.branch|android.accept_sdk_license)" \
            buildozer.spec || true

      # ------------------------------------------------------------
      # Verify p4a can initialize
      # ------------------------------------------------------------
      - name: Prepare python-for-android
        run: |
          buildozer android p4a -- --help

      # ------------------------------------------------------------
      # Clean previous build
      # ------------------------------------------------------------
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Build debug APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee buildozer.log

      # ------------------------------------------------------------
      # Diagnostics
      # ------------------------------------------------------------
      - name: Show generated files
        if: always()
        run: |
          echo "======================================"
          echo "BIN DIRECTORY"
          echo "======================================"

          ls -lah bin || true

          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find bin \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      # ------------------------------------------------------------
      # Save complete Buildozer log
      # ------------------------------------------------------------
      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-android-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14