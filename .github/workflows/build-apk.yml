name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libstdc++6


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Show build environment
        run: |
          python --version
          java -version
          buildozer --version

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer"
          echo "y" | buildozer android p4a -- --help || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          echo "=== bin ==="
          ls -lah bin || true
          echo "=== buildozer ==="
          find .buildozer -maxdepth 3 -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-android-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14