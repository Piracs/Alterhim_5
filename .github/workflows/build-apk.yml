name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            automake \
            libltdl-dev \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Check environment
        run: |
          echo "=== Python ==="
          python --version

          echo "=== Java ==="
          java -version

          echo "=== Buildozer ==="
          buildozer --version

      - name: Prepare Android environment
        run: |
          sed -i.bak \
            "s/# android.accept_sdk_license = False/android.accept_sdk_license = True/" \
            buildozer.spec

          buildozer android p4a -- --help

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Show APK
        if: always()
        run: |
          echo "=== bin ==="
          ls -lah bin || true

          echo "=== APK ==="
          find bin -type f -name "*.apk" -print || true

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-android-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14