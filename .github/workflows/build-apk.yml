name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Получаем проект
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # 2. Python 3.14
      # --------------------------------------------------
      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # --------------------------------------------------
      # 4. Linux dependencies
      # --------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            unzip \
            zip \
            gettext

      # --------------------------------------------------
      # 5. Python build dependencies
      # --------------------------------------------------
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "git+https://github.com/kivy/buildozer.git"

          python -m pip install \
            legacy-cgi \
            setuptools \
            "cython==0.29.34"

      # --------------------------------------------------
      # 6. Check environment
      # --------------------------------------------------
      - name: Check versions
        run: |
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="
          python --version
          python -m pip --version

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="
          buildozer --version

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

      # --------------------------------------------------
      # 7. Verify buildozer.spec
      # --------------------------------------------------
      - name: Check buildozer.spec
        run: |
          echo "=========================================="
          echo "ANDROID CONFIGURATION"
          echo "=========================================="

          grep -E \
            "^(android.api|android.minapi|android.ndk|android.ndk_api|p4a.branch|p4a.bootstrap|android.archs|requirements)" \
            buildozer.spec || true

      # --------------------------------------------------
      # 8. Clean old Buildozer data
      # --------------------------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------
      - name: Build debug APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee buildozer.log

      # --------------------------------------------------
      # 10. Show APK
      # --------------------------------------------------
      - name: Find APK
        if: always()
        run: |
          echo "=========================================="
          echo "BIN"
          echo "=========================================="

          ls -lah bin || true

          echo "=========================================="
          echo "APK"
          echo "=========================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print || true

      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-android-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 12. Upload complete log
      # --------------------------------------------------
      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 14